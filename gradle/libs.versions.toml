[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
navigation = "2.10.2"
coroutines = "1.11.0"
lifecycle = "2.11.0"
hiltAndroidx = "1.4.0"
room = "2.8.5"
sqlite = "2.7.1"
sqlcipher = "4.19.1"
hilt = "2.60.1"
okhttp = "5.5.0"
detekt = "2.0.0-alpha.6"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.76.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"
androidxTestRunner = "1.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
